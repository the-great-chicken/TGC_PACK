name: Create Resource Pack

on:
  push:
    branches:
      - main

jobs:
  create-resource-pack:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Define release identity
      id: release
      run: |
        echo "major=$(cat version.txt)" >> "$GITHUB_OUTPUT"
        echo "id=v$(cat version.txt)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

    - name: Embed release identity
      run: |
        printf '{"schemaVersion":1,"release":"%s","commit":"%s"}\n' '${{ steps.release.outputs.id }}' '${{ github.sha }}' > TGC_Pack/release.json

    - name: Create Resource Pack Zip
      run: |
        cd TGC_Pack
        zip -r ../TGC_Pack_V${{ steps.release.outputs.major }}-${{ github.run_number }}.zip .
      
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.release.outputs.id }}
        release_name: Release ${{ steps.release.outputs.major }}-${{ github.run_number }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./TGC_Pack_V${{ steps.release.outputs.major }}-${{ github.run_number }}.zip
        asset_name: TGC_Pack_V${{ steps.release.outputs.major }}-${{ github.run_number }}.zip
        asset_content_type: application/zip
